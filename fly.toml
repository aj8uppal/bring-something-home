app = "bring-something-home"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8790"
  DATA_PATH = "/app/data/emberwilds.sqlite"
  TRUST_PROXY = "fly"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 60
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "emberwilds_data"
  destination = "/app/data"
  initial_size = "1gb"
  snapshot_retention = 7

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"
